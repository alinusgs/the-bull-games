<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Бычий Замес</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#17120f;color:#f4efe9;font-family:system-ui,sans-serif}canvas#game{position:fixed;inset:0;width:100vw;height:100vh}.hud{position:fixed;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;pointer-events:none}.pill{background:#211a16d9;border:1px solid #3c3029;border-radius:12px;padding:10px 16px;font-weight:800}.screen{position:fixed;inset:0;display:grid;place-items:center;background:#17120fe8;padding:24px}.panel{width:min(520px,100%);text-align:center;background:#211a16;border:1px solid #3c3029;border-radius:24px;padding:24px}.panel h1{font-size:48px;line-height:.9;margin:0 0 10px}.panel h1 span{color:#e0482f}.panel p{color:#b9aea4;line-height:1.5}.mascot{height:250px}.btn{border:0;background:#e0482f;color:#fff;border-radius:12px;padding:14px 32px;font-weight:900;font-size:18px}.hidden{display:none}.warn{position:fixed;top:75px;left:50%;transform:translateX(-50%);background:#e0482f;padding:10px 18px;border-radius:10px;font-weight:900}.over{font-size:46px;font-weight:900;text-align:center}.over span{color:#e0482f}.end .code{font-size:24px;letter-spacing:3px;background:#f4efe9;color:#e0482f;padding:10px;border-radius:8px;margin:12px}
</style></head><body><canvas id="game"></canvas><div class="hud"><div class="pill">🥩 <span id="score">0</span></div><div class="pill">❤️ <span id="lives">3</span></div><div class="pill">⏱ <span id="time">180</span></div></div><div id="warn" class="warn hidden">ШЕФ БРОСАЕТ НОЖИ!</div><section id="start" class="screen"><div class="panel"><div id="mascot" class="mascot"></div><h1>БЫЧИЙ<br><span>ЗАМЕС</span></h1><p>Свайп влево/вправо — смена полосы. Свайп вверх — прыжок. Свайп вниз — подкат.</p><button id="go" class="btn">ПОГНАЛИ</button></div></section><section id="end" class="screen hidden"><div class="panel"><div class="over">ЗАБЕГ <span>ОКОНЧЕН</span></div><h2 id="final">0</h2><div id="rank"></div><div class="code" id="promo"></div><p>Покажи код официанту.</p><button id="again" class="btn">ЗАНОВО</button></div></section><script src="../mascot3d.js"></script><script>
const c=document.getElementById('game'),ctx=c.getContext('2d');let W,H,dpr=1;function size(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',size);size();
let state='start',score=0,lives=3,time=180,lane=1,y=0,vy=0,slide=0,speed=260,items=[],last=performance.now(),spawn=0,runT=0;const lanes=[W*.32,W*.5,W*.68];function laneX(l){return W<600?W*.5+(l-1)*W*.24:lanes[l]}
function add(type,l){items.push({type,l,z:0,hit:false})}function reset(){score=0;lives=3;time=180;lane=1;y=0;vy=0;slide=0;items=[];spawn=.4;state='run';document.getElementById('start').classList.add('hidden');document.getElementById('end').classList.add('hidden');document.getElementById('warn').classList.add('hidden');hud()}function hud(){scoreEl.textContent=score;livesEl.textContent=lives;timeEl.textContent=Math.ceil(time)}const scoreEl=document.getElementById('score'),livesEl=document.getElementById('lives'),timeEl=document.getElementById('time');
function move(n){if(state==='run')lane=Math.max(0,Math.min(2,lane+n))}function jump(){if(state==='run'&&y<=0){vy=720}}function down(){if(state==='run')slide=.45}addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='a')move(-1);if(e.key==='ArrowRight'||e.key==='d')move(1);if(['ArrowUp','w',' ','ArrowDown','s'].includes(e.key)){e.preventDefault();e.key==='ArrowDown'||e.key==='s'?down():jump()}});let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.max(Math.abs(dx),Math.abs(dy))<25)return;if(Math.abs(dx)>Math.abs(dy))move(dx>0?1:-1);else dy<0?jump():down()},{passive:true});
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#2b201b';ctx.fillRect(0,0,W,H);ctx.fillStyle='#4c2b22';ctx.fillRect(0,H*.18,W,H*.82);ctx.strokeStyle='#d8cbbd';ctx.lineWidth=2;for(let i=0;i<14;i++){let z=(i+((runT*speed/140)%1));let y0=H*.2+z*z*(H*.7);ctx.beginPath();ctx.moveTo(W*.16,y0);ctx.lineTo(W*.84,y0);ctx.stroke()}for(let l=0;l<3;l++){ctx.strokeStyle='#3a2c25';ctx.lineWidth=4;ctx.beginPath();ctx.moveTo(W*.16+l*W*.34,H*.2);ctx.lineTo(W*.5+(l-1)*W*.34,H);ctx.stroke()}
 items.forEach(o=>{let p=o.z,sy=H*.25+p*p*(H*.6),sx=laneX(o.l);ctx.fillStyle=o.type==='meat'?'#b8322a':o.type==='knife'?'#eee':'#e0a44f';ctx.save();ctx.translate(sx,sy);ctx.rotate(o.type==='knife'?-.3:0);ctx.fillRect(-22,-18,44,36);ctx.restore()});
 const bx=laneX(lane),by=H*.78-y;ctx.save();ctx.translate(bx,by);ctx.scale(slide?1:.9,slide?.45:1);ctx.fillStyle='#b9bb83';ctx.beginPath();ctx.ellipse(0,20,45,58,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#b86225';ctx.beginPath();ctx.arc(0,-55,42,0,Math.PI*2);ctx.fill();ctx.fillStyle='#8c5548';ctx.beginPath();ctx.ellipse(0,-38,25,18,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#9a6734';ctx.lineWidth=10;ctx.beginPath();ctx.moveTo(-38,-72);ctx.quadraticCurveTo(-72,-100,-58,-125);ctx.moveTo(38,-72);ctx.quadraticCurveTo(72,-100,58,-125);ctx.stroke();ctx.fillStyle='#4b4c24';ctx.fillRect(-28,70,18,45);ctx.fillRect(10,70,18,45);ctx.restore();}
function update(dt){if(state!=='run')return;time-=dt;runT+=dt;spawn-=dt;if(time<=0){end();return}if(spawn<=0){let r=Math.random();add(r<.18?'knife':r<.62?'meat':'burger',Math.floor(Math.random()*3));spawn=Math.max(.35,.8-score/9000)}y+=vy*dt;vy-=1500*dt;if(y<0){y=0;vy=0}slide=Math.max(0,slide-dt);for(let i=items.length-1;i>=0;i--){let o=items[i];o.z+=dt*(speed/420);if(!o.hit&&o.z>.84&&o.z<1.02&&o.l===lane){o.hit=true;if(o.type==='meat'){score+=50}else{lives--;if(lives<=0){end();return}}hud()}if(o.z>1.15)items.splice(i,1)}speed+=dt*2;hud()}
function end(){state='end';document.getElementById('final').textContent=score;document.getElementById('rank').textContent=score>5000?'ЛЕГЕНДА ГРИЛЯ':score>2000?'Бычий Аппетит':'Стейк';document.getElementById('promo').textContent='BULL-'+Math.random().toString(36).slice(2,8).toUpperCase();document.getElementById('end').classList.remove('hidden');document.getElementById('warn').classList.add('hidden')}
function loop(t){let dt=Math.min(.035,(t-last)/1000);last=t;update(dt);draw();requestAnimationFrame(loop)}document.getElementById('go').onclick=reset;document.getElementById('again').onclick=reset;TheBykMascot.mountMascot3D(document.getElementById('mascot'),{back:true,run:true,scale:.62});requestAnimationFrame(loop);
</script></body></html>
