<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мясной Матч — The Бык</title><style>
*{box-sizing:border-box}body{margin:0;background:#15110f;color:#f4efe9;font-family:system-ui,sans-serif}.wrap{min-height:100vh;max-width:720px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-weight:900;color:#e0482f;letter-spacing:.08em}.mascot{height:210px}.board{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;max-width:520px;margin:20px auto}.tile{aspect-ratio:1;border:0;border-radius:14px;background:#2a211d;color:#fff;font-size:30px;cursor:pointer}.tile.sel{outline:3px solid #e8b04a}.tile.matched{opacity:.25}.btn{background:#e0482f;color:#fff;border:0;border-radius:10px;padding:12px 18px;font-weight:900}.center{text-align:center}.panel{background:#211a16;border:1px solid #3b302a;border-radius:20px;padding:18px}.hidden{display:none}.code{font-size:24px;font-weight:900;letter-spacing:3px;color:#e0482f;margin:12px}
</style></head><body><main class="wrap"><div class="top"><div class="logo">THE БЫК</div><div>Очки: <b id="score">0</b></div></div><div id="mascot" class="mascot"></div><div class="panel center"><h1>Мясной Матч</h1><p>Свайпай соседние плитки. 3 одинаковых — эволюция продукта уровнем выше.</p><div id="board" class="board"></div><button id="new" class="btn">Новая игра</button></div><div id="end" class="panel center hidden"><h2>Раунд окончен</h2><div class="code" id="code"></div><button class="btn" onclick="location.reload()">Сыграть ещё</button></div></main><script src="../mascot3d.js"></script><script>
const icons=['🥩','🍞','🍗','🥓','🌿'];let a=[],sel=-1,score=0;const board=document.getElementById('board');function make(){a=Array.from({length:25},()=>icons[Math.floor(Math.random()*icons.length)]);render()}function render(){board.innerHTML='';a.forEach((v,i)=>{let b=document.createElement('button');b.className='tile'+(i===sel?' sel':'');b.textContent=v;b.onclick=()=>pick(i);board.appendChild(b)})}function pick(i){if(sel<0){sel=i;render();return}let x=Math.floor(sel/5),y=sel%5,xx=Math.floor(i/5),yy=i%5;if(Math.abs(x-xx)+Math.abs(y-yy)!==1){sel=i;render();return}[sel,i]=[i,sel];score+=10;if(a[sel]===a[i])score+=20;document.getElementById('score').textContent=score;sel=-1;render()}document.getElementById('new').onclick=make;make();TheBykMascot.mountMascot3D(document.getElementById('mascot'),{wave:true,scale:.62});
</script></body></html>
