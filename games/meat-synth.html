<!DOCTYPE html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Мясной Синтез — The Бык</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}body{margin:0;overflow:hidden;background:#111;color:#f3ece4;font-family:Arial,sans-serif;height:100vh;display:flex;align-items:center;justify-content:center;background-image:repeating-linear-gradient(90deg,#141210 0 18px,#0d0c0b 18px 22px)}#app{width:min(94vw,500px);display:flex;flex-direction:column;gap:12px}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:11px;color:#8a7f74;letter-spacing:2px;text-transform:uppercase}.brand b{color:#e0482f}.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.stat{background:#1a1715;border:1px solid #2a2420;border-radius:10px;padding:9px 12px}.stat small{display:block;color:#8a7f74;font-size:10px;text-transform:uppercase;letter-spacing:1px}.stat b{font-size:19px}.arena{position:relative;width:100%;aspect-ratio:.86;background:linear-gradient(#171311,#0b0a09);border:1px solid #d6261f55;border-radius:16px;overflow:hidden;box-shadow:inset 0 0 60px #d6261f18}.arena canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.overlay{position:fixed;inset:0;background:#0d0c0bf2;display:flex;align-items:center;justify-content:center;z-index:10;padding:20px;overflow:auto}.hide{display:none}.card{width:min(92vw,430px);text-align:center;display:flex;flex-direction:column;gap:13px;align-items:center}.card h1{font-size:30px;margin:0}.card h1 span{color:#e0482f}.card p{margin:0;color:#b5aa9e;line-height:1.55;font-size:14px}.btn{border:0;border-radius:10px;padding:14px 24px;font-weight:800;font-size:15px;cursor:pointer;background:#d6261f;color:#fff}.btn.ghost{background:#1a1715;border:1px solid #2a2420}.rank{color:#ffd75e;font-size:22px;font-weight:800}.big{font-size:44px;color:#d6261f;font-weight:900}.code{font-weight:800;letter-spacing:2px;background:#1a1715;padding:8px 14px;border-radius:8px;border:1px dashed #d6a630}.hint{font-size:11px;color:#756d66}.mascot-small{position:absolute;right:10px;top:10px;width:105px;height:145px;z-index:3;pointer-events:none;filter:drop-shadow(0 8px 10px rgba(0,0,0,.35))}
</style></head><body><div id="app"><div class="head"><div><div class="brand">🐂 <b>The Бык</b> представляет</div><h2 style="margin:5px 0 0">Мясной <span style="color:#e0482f">Синтез</span></h2></div><button class="btn ghost" id="mute">🔊</button></div><div class="stats"><div class="stat"><small>Очки</small><b id="score">0</b></div><div class="stat"><small>Время</small><b id="time">3:00</b></div><div class="stat"><small>Уровень</small><b id="level">1</b></div></div><div class="arena"><canvas id="canvas"></canvas><canvas id="cornerMascot" class="mascot-small"></canvas></div></div><div class="overlay" id="start"><div class="card"><canvas id="startMascot" style="width:180px;height:230px"></canvas><h1>Мясной <span>Синтез</span></h1><p>Сбрасывай мясо в корзину. Одинаковые куски сталкиваются и объединяются в продукт следующего уровня. Дойди до Золотого Быка!</p><button class="btn" id="go">▶ Начать — 3 минуты</button></div></div><div class="overlay hide" id="end"><div class="card"><canvas id="endMascot" style="width:150px;height:190px"></canvas><div class="rank" id="rank"></div><div class="big" id="final">0</div><div class="code" id="promo"></div><p>Покажи код на кассе The Бык и получи бонус.</p><button class="btn" id="again">↻ Ещё раз</button></div></div><script src="../mascot3d.js"></script><script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let W,H,dpr,balls=[],current=1,next=2,score=0,time=180,playing=false,dropCd=0,gravity=850,mouseX=0,raf,last=0,muted=false;const levels=[null,{name:'Бекон',r:18,e:'🥓',c:'#c23a4c',p:1},{name:'Ножка',r:25,e:'🍗',c:'#b5502a',p:3},{name:'Котлета',r:34,e:'🍔',c:'#7a2a1c',p:6},{name:'Стейк',r:43,e:'🥩',c:'#8e1426',p:10},{name:'Окорок',r:53,e:'🍖',c:'#6e1d14',p:15},{name:'Маскот The Бык',r:66,e:'🐂',c:'#a87405',p:50}];function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=canvas.clientWidth*dpr;canvas.height=canvas.clientHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}resize();addEventListener('resize',resize);Mascot3D.mount(document.getElementById('startMascot'),{mode:'front',wave:true,scale:.55});Mascot3D.mount(document.getElementById('endMascot'),{mode:'front',scale:.45});Mascot3D.mount(document.getElementById('cornerMascot'),{mode:'front',scale:.28});
function tone(f,d=.1){if(muted)return;try{let a=window._ac||(window._ac=new AudioContext),o=a.createOscillator(),g=a.createGain();o.frequency.value=f;g.gain.value=.05;o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+d)}catch(e){}}
function spawn(l,x){balls.push({x:x??W/2,y:70,r:levels[l].r,vx:(Math.random()-.5)*35,vy:20,l,dead:false});}
function reset(){balls=[];score=0;time=180;current=1;next=2;dropCd=0;document.getElementById('score').textContent=0;document.getElementById('time').textContent='3:00';document.getElementById('level').textContent=1;}
function merge(a,b){let l=a.l+1,x=(a.x+b.x)/2,y=(a.y+b.y)/2;score+=levels[l].p*10;if(l<6){balls.push({x,y,r:levels[l].r,vx:0,vy:-90,l,dead:false});document.getElementById('level').textContent=l}else{score+=500;flash();tone(880,.3)}a.dead=b.dead=true;document.getElementById('score').textContent=score}
function flash(){document.body.animate([{filter:'brightness(1)'},{filter:'brightness(1.8)'},{filter:'brightness(1)'}],{duration:220})}
function physics(dt){let floor=canvas.clientHeight-18;for(const b of balls){if(b.dead)continue;b.vy+=gravity*dt;b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.55}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.55}if(b.y>floor-b.r){b.y=floor-b.r;b.vy*=-.35;b.vx*=.94}}for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){let a=balls[i],b=balls[j];if(a.dead||b.dead||a.l!==b.l||a.l>=6)continue;let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),min=a.r+b.r;if(d<min&&d>0){let nx=dx/d,ny=dy/d,over=min-d;a.x-=nx*over/2;a.y-=ny*over/2;b.x+=nx*over/2;b.y+=ny*over/2;merge(a,b)}}balls=balls.filter(b=>!b.dead)}
function draw(){ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);let w=canvas.clientWidth,h=canvas.clientHeight;ctx.fillStyle='#0b0a09';ctx.fillRect(0,0,w,h);ctx.fillStyle='#221a17';ctx.fillRect(0,h-18,w,18);for(let i=0;i<9;i++){ctx.strokeStyle='#2c2520';ctx.beginPath();ctx.moveTo(i*w/8,0);ctx.lineTo(i*w/8,h);ctx.stroke()}balls.slice().sort((a,b)=>a.y-b.y).forEach(b=>{let L=levels[b.l],g=ctx.createRadialGradient(b.x-b.r*.3,b.y-b.r*.4,b.r*.1,b.x,b.y,b.r);g.addColorStop(0,'#fff3e8');g.addColorStop(.25,L.c);g.addColorStop(1,'#180d0b');ctx.fillStyle=g;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();ctx.font=`${Math.max(16,b.r*1.1)}px serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(L.e,b.x,b.y);});ctx.fillStyle='#8a7f74';ctx.font='12px Arial';ctx.textAlign='center';ctx.fillText('Кликай по полю, чтобы менять место сброса',w/2,16)}
function loop(ts){let dt=Math.min(.032,(ts-last)/1000||0);last=ts;if(playing){time=Math.max(0,time-dt);document.getElementById('time').textContent=Math.floor(time/60)+':'+String(Math.floor(time%60)).padStart(2,'0');physics(dt);dropCd-=dt;if(time<=0){playing=false;endGame()}}draw();raf=requestAnimationFrame(loop)}function start(){reset();playing=true;document.getElementById('start').classList.add('hide');document.getElementById('end').classList.add('hide');cancelAnimationFrame(raf);last=performance.now();raf=requestAnimationFrame(loop)}function endGame(){document.getElementById('final').textContent=score;document.getElementById('rank').textContent=score>4000?'ЗОЛОТОЙ БЫК':score>1800?'СЕРЕБРЯНЫЙ БЫК':'БЫЧОК-НОВИЧОК';document.getElementById('promo').textContent='SYN-'+Math.random().toString(36).slice(2,8).toUpperCase();document.getElementById('end').classList.remove('hide')}
canvas.addEventListener('pointerdown',e=>{if(!playing)return;let r=canvas.getBoundingClientRect();mouseX=e.clientX-r.left;spawn(current,mouseX)});document.getElementById('go').onclick=start;document.getElementById('again').onclick=start;document.getElementById('mute').onclick=function(){muted=!muted;this.textContent=muted?'🔇':'🔊'};
</script></body></html>
