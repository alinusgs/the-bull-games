<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Мясной Синтез — The Бык</title><style>
*{box-sizing:border-box}body{margin:0;background:#15110f;color:#f4efe9;font-family:system-ui,sans-serif}.wrap{max-width:760px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between}.arena{position:relative;height:65vh;min-height:430px;background:linear-gradient(#3b2921,#241914);border:1px solid #49382f;border-radius:22px;overflow:hidden;margin-top:15px}.item{position:absolute;width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:#e0a44f;box-shadow:0 7px 20px #0008;cursor:pointer}.mascot{height:170px}.panel{background:#211a16;border:1px solid #3b302a;border-radius:20px;padding:18px}.btn{background:#e0482f;color:#fff;border:0;border-radius:10px;padding:11px 16px;font-weight:900}.hint{color:#b9aea4}.code{color:#e0482f;font-size:24px;font-weight:900;letter-spacing:3px}
</style></head><body><main class="wrap"><div class="top"><b>МЯСНОЙ СИНТЕЗ</b><span>Очки <b id="score">0</b></span></div><div id="mascot" class="mascot"></div><div class="panel"><p class="hint">Нажимай на одинаковые продукты, чтобы объединять их. Чем выше уровень — тем больше очков.</p><div id="arena" class="arena"></div><button id="add" class="btn">Добавить продукт</button><button id="reset" class="btn">Сбросить</button></div><p id="code" class="code"></p></main><script src="../mascot3d.js"></script><script>
const A=document.getElementById('arena'),scoreEl=document.getElementById('score');let score=0,items=[];const food=['🥩','🍔','🍗','🥓','🍖'];function add(){let e=document.createElement('div');e.className='item';let v=food[Math.floor(Math.random()*food.length)];e.textContent=v;e.dataset.v=v;e.style.left=Math.random()*(A.clientWidth-58)+'px';e.style.top=Math.random()*(A.clientHeight-58)+'px';e.onclick=()=>{let same=items.find(x=>x!==e&&x.dataset.v===e.dataset.v);if(same){score+=100;scoreEl.textContent=score;same.textContent='🍔';e.remove();items=items.filter(x=>x!==e)}else{score+=10;scoreEl.textContent=score}};A.appendChild(e);items.push(e)}document.getElementById('add').onclick=add;document.getElementById('reset').onclick=()=>{A.innerHTML='';items=[];score=0;scoreEl.textContent=0;for(let i=0;i<8;i++)add()};for(let i=0;i<8;i++)add();TheBykMascot.mountMascot3D(document.getElementById('mascot'),{wave:true,scale:.5});
</script></body></html>
